<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>USM Amazing Race</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.8.0/mapbox-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--teal:#3cc8d0;--teal-d:#1b9aa2;--ink:#1d2327;--paper:#fffdf7;--done:#41b35d;--warn:#f2a33a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#111}
  #map{position:absolute;inset:0}
  header{position:absolute;top:10px;left:10px;right:60px;z-index:2;background:var(--paper);border:2.5px solid var(--ink);
    border-radius:14px;padding:8px 12px;box-shadow:3px 3px 0 var(--ink)}
  header h1{font-family:Fredoka,sans-serif;font-size:19px;margin:0;line-height:1.1}
  header .sub{font-size:12px;opacity:.75}
  .bar{height:9px;background:#e8e4d8;border-radius:6px;margin-top:6px;overflow:hidden;border:1.5px solid var(--ink)}
  .bar i{display:block;height:100%;width:0;background:var(--done);transition:width .4s}
  #next{font-size:13px;margin-top:5px;font-weight:600}
  /* markers */
  .mk{width:38px;height:38px;border-radius:50%;background:var(--teal);border:3px solid var(--ink);display:grid;place-items:center;
    font-family:Fredoka,sans-serif;font-weight:700;font-size:17px;color:var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:pointer}
  .mk.done{background:var(--done);color:#fff}
  .mk.next{animation:pulse 1.4s infinite}
  .mk .em{position:absolute;top:-14px;right:-14px;font-size:18px;filter:drop-shadow(1px 1px 0 #fff)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,163,58,.9),2px 2px 0 var(--ink)}100%{box-shadow:0 0 0 18px rgba(242,163,58,0),2px 2px 0 var(--ink)}}
  .editing .mk{background:var(--warn);cursor:move}
  /* sheet */
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:3;background:var(--paper);border-top:2.5px solid var(--ink);
    border-radius:18px 18px 0 0;max-height:46vh;display:flex;flex-direction:column;transition:transform .3s}
  #sheet.min{transform:translateY(calc(100% - 46px))}
  #grab{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:Fredoka,sans-serif;font-size:16px}
  #grab .h{width:40px;height:5px;background:#bbb;border-radius:3px;position:absolute;left:50%;top:5px;transform:translateX(-50%)}
  #list{overflow:auto;padding:0 10px 12px}
  .row{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;border:1.5px solid transparent}
  .row:hover{background:#f2eee2}
  .row.done .nm{text-decoration:line-through;opacity:.6}
  .num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--teal);border:2px solid var(--ink);display:grid;place-items:center;font-family:Fredoka;font-weight:700}
  .row.done .num{background:var(--done);color:#fff}
  .nm{font-weight:600;font-size:14px}
  .cl{font-size:12px;opacity:.75}
  .grow{flex:1;min-width:0}
  button{font-family:Fredoka,sans-serif;font-size:14px;border:2px solid var(--ink);background:#fff;border-radius:9px;padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  button:active{transform:translate(2px,2px);box-shadow:none}
  button.go{background:var(--teal)}
  button.ok{background:var(--done);color:#fff}
  .tools{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px 10px;border-top:1.5px dashed #ccc}
  #editbar{display:none;position:absolute;top:96px;left:10px;right:10px;z-index:2;background:#fff3dd;border:2.5px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:13px;box-shadow:3px 3px 0 var(--ink)}
  .editing #editbar{display:block}
  .mapboxgl-popup-content{font-family:Inter;border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);padding:10px 12px}
  .mapboxgl-popup-content h3{font-family:Fredoka;margin:0 0 4px;font-size:16px}
  #toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);opacity:0;pointer-events:none;z-index:9;background:var(--paper);
    border:3px solid var(--ink);border-radius:16px;padding:16px 22px;font-family:Fredoka;font-size:22px;text-align:center;box-shadow:4px 4px 0 var(--ink);transition:.25s}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
</style>
</head>
<body>
<div id="map"></div>

<header>
  <h1>🏁 USM Amazing Race</h1>
  <div class="sub">University of Southern Mindanao · Kabacan</div>
  <div class="bar"><i id="prog"></i></div>
  <div id="next">Loading stations…</div>
</header>

<div id="editbar">
  <b>✏️ Edit mode:</b> drag markers to the right spot, or tap a station below → <b>📍 Here</b> to drop it at your GPS position.
  When done: <button id="dl">⬇ Download stations.geojson</button> <button id="cp">Copy</button> <button id="exitEdit">Done</button>
</div>

<div id="sheet">
  <div id="grab"><span class="h"></span><span id="count">Stations</span><span>▾</span></div>
  <div id="list"></div>
  <div class="tools">
    <button id="fit">🗺 Show all</button>
    <button id="view3d">⬜ 2D view</button>
    <button id="base">🛰 Mapbox imagery</button>
    <button id="reset">↺ Reset progress</button>
    <button id="edit">✏️ Edit positions</button>
  </div>
</div>
<div id="toast"></div>

<script>
mapboxgl.accessToken = 'pk.eyJ1IjoicGV0ZXJkb21pbmljIiwiYSI6ImNtdnc3NThkOTA1b2Eyd3ExNW5mdG85ancifQ.wUKa4dvO6FLRadv2xAKeWQ';

const LS_DONE = 'usmRaceDone', LS_POS = 'usmRaceEditedPositions';
const store = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch(e){} }
};
let stations = [], markers = {}, done = new Set(store.get(LS_DONE, [])), editing = false, userPos = null;

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/satellite-streets-v12',
  center: [124.8293, 7.1200], zoom: 17.5, pitch: 60, bearing: -20, antialias: true
});
map.addControl(new mapboxgl.NavigationControl({ visualizePitch: true }), 'top-right');
const geo = new mapboxgl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true, showUserHeading: true });
map.addControl(geo, 'top-right');
map.addControl(new mapboxgl.ScaleControl({ unit: 'metric' }), 'bottom-left');
geo.on('geolocate', e => { userPos = [e.coords.longitude, e.coords.latitude]; updateHeader(); });

async function loadStations(){
  let gj;
  try { gj = await (await fetch('stations.geojson', { cache: 'no-store' })).json(); }
  catch(e){ toast('Could not load stations.geojson'); return; }
  const edited = store.get(LS_POS, {});
  stations = gj.features.map(f => ({ ...f.properties, coord: edited[f.properties.id] || f.geometry.coordinates }))
                        .sort((a, b) => a.id - b.id);
}

function routeGeoJSON(){
  return { type: 'Feature', geometry: { type: 'LineString', coordinates: stations.map(s => s.coord) } };
}

function nextStation(){ return stations.find(s => !done.has(s.id)); }

function dist(a, b){ // metres, haversine
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[1]-a[1])*r, dLon = (b[0]-a[0])*r;
  const h = Math.sin(dLat/2)**2 + Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function bearingTxt(a, b){
  const r = Math.PI/180, y = Math.sin((b[0]-a[0])*r)*Math.cos(b[1]*r),
        x = Math.cos(a[1]*r)*Math.sin(b[1]*r) - Math.sin(a[1]*r)*Math.cos(b[1]*r)*Math.cos((b[0]-a[0])*r);
  const deg = (Math.atan2(y, x)/r + 360) % 360;
  return ['N','NE','E','SE','S','SW','W','NW'][Math.round(deg/45) % 8];
}

function updateHeader(){
  const n = nextStation(), pct = stations.length ? done.size / stations.length * 100 : 0;
  document.getElementById('prog').style.width = pct + '%';
  document.getElementById('count').textContent = `Stations · ${done.size}/${stations.length} done`;
  let t;
  if (!n) t = '🎉 All stations cleared! Head back to the organisers.';
  else {
    t = `Next: ${n.id}. ${n.icon} ${n.name}`;
    if (userPos) { const d = dist(userPos, n.coord); t += ` — ${d < 1000 ? Math.round(d) + ' m' : (d/1000).toFixed(2) + ' km'} ${bearingTxt(userPos, n.coord)}`; }
  }
  document.getElementById('next').textContent = t;
  stations.forEach(s => {
    const el = markers[s.id]?.getElement();
    if (el) { el.classList.toggle('done', done.has(s.id)); el.classList.toggle('next', n && s.id === n.id && !editing); }
  });
}

function popupHTML(s){
  const isDone = done.has(s.id);
  return `<h3>${s.id}. ${s.icon} ${s.name}</h3>
    <button class="${isDone ? '' : 'ok'}" onclick="toggleDone(${s.id})">${isDone ? 'Undo' : '✔ Mark as found'}</button>`;
}

function buildMarkers(){
  Object.values(markers).forEach(m => m.remove()); markers = {};
  stations.forEach(s => {
    const el = document.createElement('div');
    el.className = 'mk'; el.innerHTML = `${s.id}<span class="em">${s.icon}</span>`;
    const m = new mapboxgl.Marker({ element: el, draggable: editing }).setLngLat(s.coord)
      .setPopup(new mapboxgl.Popup({ offset: 24 }).setHTML(popupHTML(s))).addTo(map);
    m.on('dragend', () => { const ll = m.getLngLat(); setCoord(s.id, [ll.lng, ll.lat]); });
    markers[s.id] = m;
  });
}

function setCoord(id, c){
  const s = stations.find(x => x.id === id);
  s.coord = [+c[0].toFixed(6), +c[1].toFixed(6)];
  markers[id].setLngLat(s.coord);
  const edited = store.get(LS_POS, {}); edited[id] = s.coord; store.set(LS_POS, edited);
  map.getSource('route')?.setData(routeGeoJSON());
  updateHeader();
}

function buildList(){
  const list = document.getElementById('list'); list.innerHTML = '';
  stations.forEach(s => {
    const row = document.createElement('div');
    row.className = 'row' + (done.has(s.id) ? ' done' : '');
    row.innerHTML = `<div class="num">${s.id}</div><div class="grow"><div class="nm">${s.icon} ${s.name}</div></div>`;
    const go = document.createElement('button'); go.className = 'go'; go.textContent = 'Go';
    go.onclick = () => { map.flyTo({ center: s.coord, zoom: 19 }); markers[s.id].togglePopup(); minimise(true); };
    row.appendChild(go);
    if (editing) {
      const here = document.createElement('button'); here.textContent = '📍 Here';
      here.onclick = () => {
        if (!navigator.geolocation) return toast('No GPS on this device');
        navigator.geolocation.getCurrentPosition(p => {
          setCoord(s.id, [p.coords.longitude, p.coords.latitude]);
          toast(`Station ${s.id} moved (±${Math.round(p.coords.accuracy)} m)`);
        }, () => toast('Allow location access first'), { enableHighAccuracy: true, timeout: 15000 });
      };
      row.appendChild(here);
    } else {
      const ok = document.createElement('button'); ok.className = done.has(s.id) ? '' : 'ok';
      ok.textContent = done.has(s.id) ? '↺' : '✔';
      ok.onclick = () => toggleDone(s.id);
      row.appendChild(ok);
    }
    list.appendChild(row);
  });
}

window.toggleDone = id => {
  if (done.has(id)) done.delete(id); else { done.add(id); toast(done.size === stations.length ? '🏆 Finished!' : `✔ Station ${id} cleared!`); }
  store.set(LS_DONE, [...done]);
  stations.forEach(s => markers[s.id].getPopup().setHTML(popupHTML(s)));
  buildList(); updateHeader();
};

function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1600); }
function minimise(v){ document.getElementById('sheet').classList.toggle('min', v); }
function fitAll(){ const b = new mapboxgl.LngLatBounds(); stations.forEach(s => b.extend(s.coord)); map.fitBounds(b, { padding: { top: 120, bottom: 60, left: 40, right: 60 }, maxZoom: 18.5, pitch: map.getPitch(), bearing: map.getBearing() }); }

function exportGeoJSON(){
  return JSON.stringify({ type: 'FeatureCollection', name: 'stations',
    crs: { type: 'name', properties: { name: 'urn:ogc:def:crs:OGC:1.3:CRS84' } },
    features: stations.map(s => ({ type: 'Feature', properties: { id: s.id, name: s.name, icon: s.icon },
      geometry: { type: 'Point', coordinates: s.coord } })) }, null, 2);
}

function setEditing(v){
  editing = v; document.body.classList.toggle('editing', v);
  Object.values(markers).forEach(m => m.setDraggable(v));
  buildList(); updateHeader();
}

document.getElementById('grab').onclick = () => minimise(!document.getElementById('sheet').classList.contains('min'));
document.getElementById('fit').onclick = fitAll;
document.getElementById('view3d').onclick = e => {
  const to3d = map.getPitch() < 10;
  map.easeTo({ pitch: to3d ? 60 : 0, bearing: to3d ? -20 : 0, duration: 800 });
  map.setLayoutProperty('3d-buildings', 'visibility', to3d ? 'visible' : 'none');
  e.target.textContent = to3d ? '⬜ 2D view' : '🧊 3D view';
};
document.getElementById('base').onclick = e => {
  const on = map.getLayoutProperty('esri', 'visibility') !== 'visible';
  map.setLayoutProperty('esri', 'visibility', on ? 'visible' : 'none');
  e.target.textContent = on ? '🛰 Mapbox imagery' : '🛰 Esri imagery';
};
document.getElementById('reset').onclick = () => { if (confirm('Reset all progress?')) { done.clear(); store.set(LS_DONE, []); stations.forEach(s => markers[s.id].getPopup().setHTML(popupHTML(s))); buildList(); updateHeader(); } };
document.getElementById('edit').onclick = () => setEditing(true);
document.getElementById('exitEdit').onclick = () => setEditing(false);
document.getElementById('dl').onclick = () => {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([exportGeoJSON()], { type: 'application/geo+json' }));
  a.download = 'stations.geojson'; a.click();
};
document.getElementById('cp').onclick = () => navigator.clipboard?.writeText(exportGeoJSON()).then(() => toast('Copied!'), () => toast('Copy failed'));
if (new URLSearchParams(location.search).has('edit')) setTimeout(() => setEditing(true), 0);

map.on('load', async () => {
  await loadStations();
  map.addSource('route', { type: 'geojson', data: routeGeoJSON() });
  map.addLayer({ id: 'route-casing', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#ffffff', 'line-width': 7, 'line-opacity': .8 } });
  map.addLayer({ id: 'route', type: 'line', source: 'route', layout: { 'line-cap': 'round', 'line-join': 'round' },
    paint: { 'line-color': '#1d2327', 'line-width': 4, 'line-dasharray': [0.4, 1.6] } });
  map.addLayer({ id: 'route-arrows', type: 'symbol', source: 'route',
    layout: { 'symbol-placement': 'line', 'symbol-spacing': 70, 'text-field': '▶', 'text-size': 14, 'text-keep-upright': false, 'text-allow-overlap': true },
    paint: { 'text-color': '#f2a33a', 'text-halo-color': '#1d2327', 'text-halo-width': 1.2 } });
  // backup satellite imagery (Esri World Imagery), shown under Mapbox labels
  const firstSymbol = map.getStyle().layers.find(l => l.type === 'symbol')?.id;
  map.addSource('esri', { type: 'raster', tileSize: 256, maxzoom: 19, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics',
    tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] });
  map.addLayer({ id: 'esri', type: 'raster', source: 'esri', layout: { visibility: 'visible' } }, firstSymbol);
  // 3D: terrain + extruded buildings
  map.addSource('dem', { type: 'raster-dem', url: 'mapbox://mapbox.mapbox-terrain-dem-v1', tileSize: 512, maxzoom: 14 });
  map.setTerrain({ source: 'dem', exaggeration: 1.2 });
  map.addLayer({ id: '3d-buildings', source: 'composite', 'source-layer': 'building', type: 'fill-extrusion', minzoom: 14,
    paint: { 'fill-extrusion-color': '#e9e2cf', 'fill-extrusion-opacity': 0.8,
      'fill-extrusion-height': ['coalesce', ['get', 'height'], 8],
      'fill-extrusion-base': ['coalesce', ['get', 'min_height'], 0] } }, firstSymbol);
  buildMarkers(); buildList(); updateHeader(); fitAll();
  if (editing) setEditing(true);
});
</script>
</body>
</html>
